[package]
name = "heller-web"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
heller-ui = { path = "../heller-ui" }
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
web-sys = { version = "0.3", default-features = false, features = ["Window", "Storage", "Notification", "NotificationOptions", "console", "Document", "Event", "EventTarget", "HtmlAudioElement", "HtmlMediaElement"] }

js-sys = { version = "0.3", default-features = false, features = ["std"] }
heller-core = { path = "../heller-core" }
