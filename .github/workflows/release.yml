name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release before building packages
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest --title "HellerTimer $GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64, formats: 'appimage' }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64, formats: 'appimage' }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, formats: nsis }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64, formats: nsis }
          - { runner: macos-latest, target: aarch64-apple-darwin, os: macos, arch: aarch64, formats: dmg }
          - { runner: macos-latest, target: x86_64-apple-darwin, os: macos, arch: x86_64, formats: dmg }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libx11-xcb-dev libfuse2 patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p heller-desktop --target ${{ matrix.target }} --features femtovg
      - run: cargo install cargo-packager --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
        working-directory: crates/heller-desktop
      - name: Collect packages and portable archive
        shell: python
        env:
          PACKAGE_OS: ${{ matrix.os }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, shutil, tarfile, zipfile
          root = pathlib.Path.cwd()
          output = root / 'dist'
          output.mkdir(exist_ok=True)
          stem = f"HellerTimer-{os.environ['GITHUB_REF_NAME']}-{os.environ['PACKAGE_OS']}-{os.environ['PACKAGE_ARCH']}"
          for ext in ('*.AppImage', '*.dmg', '*setup*.exe'):
              for source in root.joinpath('target').rglob(ext):
                  shutil.copy2(source, output / (stem + source.suffix))
          binary = root / 'target' / os.environ['PACKAGE_TARGET'] / 'release' / ('hellertimer.exe' if os.environ['PACKAGE_OS'] == 'windows' else 'hellertimer')
          portable = output / stem
          portable.mkdir()
          shutil.copy2(binary, portable / binary.name)
          for name in ('LICENSE', 'THIRD_PARTY.md'): shutil.copy2(root/name, portable/name)
          shutil.copytree(root/'assets/licenses', portable/'licenses')
          if os.environ['PACKAGE_OS'] == 'windows':
              (portable/'portable').touch()
              shutil.make_archive(str(output/stem), 'zip', portable)
          else:
              with tarfile.open(output/(stem+'.tar.gz'), 'w:gz') as archive: archive.add(portable, arcname=stem)
          shutil.rmtree(portable)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [create-release, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
